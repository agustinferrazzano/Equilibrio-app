services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/apps/backend/data

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:3001
    ports:
      - "3002:3002"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: equilibrio-postgres
    environment:
      POSTGRES_USER: equilibrio_user
      POSTGRES_PASSWORD: equilibrio_password
      POSTGRES_DB: equilibrio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: equilibrio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  backend-data:
  postgres-data:
  redis-data: