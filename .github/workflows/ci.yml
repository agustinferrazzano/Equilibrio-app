name: Equilibrio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @equilibrio/core
        run: npm run build --workspace=@equilibrio/core

      - name: Test @equilibrio/core
        run: npm test --workspace=@equilibrio/core

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./apps/backend

      - name: Test backend with coverage
        run: npm test --workspace=apps/backend

      - name: Build frontend
        run: npm run build --workspace=apps/frontend
