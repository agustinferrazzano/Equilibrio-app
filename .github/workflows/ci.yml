name: Equilibrio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equilibrio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @equilibrio/core
        run: npm run build --workspace=@equilibrio/core

      - name: Test @equilibrio/core
        run: npm test --workspace=@equilibrio/core

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./apps/backend

      - name: Prisma DB Push
        run: npx prisma db push
        working-directory: ./apps/backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/equilibrio"

      - name: Test backend with coverage
        run: npm test --workspace=apps/backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/equilibrio"

      - name: Build frontend
        run: npm run build --workspace=apps/frontend
